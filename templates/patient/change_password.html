{% extends "patient/base.html" %}
{% block content %}
<nav id="breadcrumbs" class="breadcrumbs">
    <div class="container page-wrapper">
        <a href="/checksymptoms">Dashboard</a> &raquo; <span class="breadcrumb_last" aria-current="page">Account Security</span>
    </div>
</nav>

<section class="py-5" style="background: #f8fafc; min-height: 80vh;">
    <div class="container">
        <div class="auth-wrapper" style="max-width: 520px;">
            <div class="auth-header">
                <div style="width: 50px; height: 50px; background: rgba(255, 255, 255, 0.15); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 12px;">
                    <i class="fa fa-shield" style="font-size: 22px; color: #38bdf8;"></i>
                </div>
                <h3>Update Password</h3>
                <p>Enhance the security of your patient health account</p>
            </div>

            <div class="auth-body">
                {% if message %}
                <div class="alert {% if 'success' in message %}alert-success{% else %}alert-danger{% endif %} mb-4" style="border-radius: 10px; font-size: 13.5px; padding: 12px 16px;">
                    <i class="fa {% if 'success' in message %}fa-check-circle{% else %}fa-exclamation-circle{% endif %}"></i> {{ message }}
                </div>
                {% endif %}

                <form method="post">
                    {% csrf_token %}

                    <div class="form-group-modern">
                        <label><i class="fa fa-lock"></i> Current Password*</label>
                        <input type="password" name="oldpassword" placeholder="Enter existing password" required>
                    </div>

                    <div class="form-group-modern">
                        <label><i class="fa fa-key"></i> New Password*</label>
                        <input type="password" name="newpassword" placeholder="Enter new password (min. 6 characters)" required>
                    </div>

                    <button type="submit" class="btn btn-modern-primary w-100 py-3 mt-2" style="font-size: 15px;">
                        <i class="fa fa-check"></i> Change Password
                    </button>
                </form>

                <div class="text-center mt-4">
                    <a href="/checksymptoms" style="color: #64748b; font-size: 13px; text-decoration: none;">
                        <i class="fa fa-arrow-left"></i>  Return to Symptom Screener
                    </a>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
