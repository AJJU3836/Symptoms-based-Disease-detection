{% extends "admin/base.html" %}
{% block content %}
<nav id="breadcrumbs" class="breadcrumbs">
    <div class="container page-wrapper">
        <a href="/patientmaster">Admin Console</a> &raquo; <a href="/specialitymaster">Specialities</a> &raquo; <span class="breadcrumb_last" aria-current="page">Add Speciality</span>
    </div>
</nav>

<section class="py-5" style="background: #f8fafc; min-height: 85vh;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h6 class="sub-title"><i class="fa fa-stethoscope"></i> New Category</h6>
                        <h2 class="hny-title" style="font-size: 26px;">Add Medical Speciality</h2>
                    </div>
                    <a href="/specialitymaster" class="btn btn-outline-secondary btn-sm" style="border-radius: 8px;">
                        <i class="fa fa-arrow-left"></i> View All
                    </a>
                </div>

                {% if message %}
                <div class="alert {% if 'success' in message %}alert-success{% else %}alert-danger{% endif %} mb-4" style="border-radius: 10px;">
                    {{ message }}
                </div>
                {% endif %}

                <div class="modern-card">
                    <form method="post">
                        {% csrf_token %}
                        <div class="form-group-modern mb-4">
                            <label><i class="fa fa-tag"></i> Speciality / Department Name*</label>
                            <input type="text" name="name" placeholder="e.g. Cardiology, Dermatology, Neurology" required autocomplete="off">
                            <small class="form-text text-muted">Enter a unique clinical category name.</small>
                        </div>

                        <button type="submit" class="btn btn-modern-primary w-100 py-3">
                            <i class="fa fa-check-circle"></i> Save Speciality
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
